name: Provider Sentinel

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the three small paid provider checks now
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read

concurrency:
  group: provider-sentinel
  cancel-in-progress: false

jobs:
  disabled-notice:
    if: ${{ inputs.run_live != true && vars.NROUTER_PROVIDER_SENTINEL_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why paid checks are disabled
        run: |
          {
            echo '# Provider Sentinel is safely disabled'
            echo
            echo 'Confirm the existing test key has a hard budget cap, then set the repository variable `NROUTER_PROVIDER_SENTINEL_ENABLED` to `true`.'
            echo 'Until then, this scheduled run sends no provider request and consumes no nRouter credits.'
          } >> "$GITHUB_STEP_SUMMARY"

  canary:
    if: ${{ inputs.run_live == true || vars.NROUTER_PROVIDER_SENTINEL_ENABLED == 'true' }}
    name: Rotating provider canary
    runs-on: ubuntu-latest
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_PROVIDER_SENTINEL_MESSAGES_MODELS: ${{ vars.NROUTER_PROVIDER_SENTINEL_MESSAGES_MODELS || vars.NROUTER_LIVE_MESSAGES_MODEL }}
      NROUTER_PROVIDER_SENTINEL_CHAT_MODELS: ${{ vars.NROUTER_PROVIDER_SENTINEL_CHAT_MODELS || vars.NROUTER_LIVE_CHAT_MODEL }}
      NROUTER_PROVIDER_SENTINEL_RESPONSES_MODELS: ${{ vars.NROUTER_PROVIDER_SENTINEL_RESPONSES_MODELS || vars.NROUTER_LIVE_RESPONSES_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require the dedicated test key
        run: test -n "$NROUTER_API_KEY"
      - name: Run three tiny rotating provider checks
        run: python scripts/provider_sentinel.py --output provider-sentinel.json
      - name: Upload provider report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-sentinel-report
          path: provider-sentinel.json
          if-no-files-found: warn
          retention-days: 30
