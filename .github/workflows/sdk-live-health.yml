# Low-cost production-health probes. Unit, contract, and conformance checks
# remain in ci.yml; this workflow proves a small set of real gateway routes.
name: SDK live health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: sdk-live-health
  cancel-in-progress: false

jobs:
  javascript-live:
    name: JavaScript live core routes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
      NROUTER_LIVE_CHAT_MODEL: ${{ vars.NROUTER_LIVE_CHAT_MODEL }}
      NROUTER_LIVE_RESPONSES_MODEL: ${{ vars.NROUTER_LIVE_RESPONSES_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json

      - name: Verify live-test configuration
        run: |
          test -n "$NROUTER_API_KEY"
          test -n "$NROUTER_LIVE_CHAT_MODEL"
          test -n "$NROUTER_LIVE_RESPONSES_MODEL"

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Run low-cost JavaScript probes
        run: >-
          node --test
          --test-name-pattern='live Claude|live OpenAI chat|live Responses'
          test/live.test.ts

  python-live:
    name: Python live core routes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
      NROUTER_LIVE_CHAT_MODEL: ${{ vars.NROUTER_LIVE_CHAT_MODEL }}
      NROUTER_LIVE_RESPONSES_MODEL: ${{ vars.NROUTER_LIVE_RESPONSES_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify live-test configuration
        run: |
          test -n "$NROUTER_API_KEY"
          test -n "$NROUTER_LIVE_CHAT_MODEL"
          test -n "$NROUTER_LIVE_RESPONSES_MODEL"

      - name: Install SDK test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run low-cost Python probes
        run: >-
          python -m pytest -q
          tests/test_live.py::test_live_claude_messages_returns_billing_metadata
          tests/test_live.py::test_live_openai_chat_completions_wire_answers
          tests/test_live.py::test_live_responses_wire_answers

  dart-live:
    name: Dart live Messages stream
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Require the dedicated health-check key
        run: test -n "$NROUTER_API_KEY"

      - name: Install dependencies
        run: dart pub get

      - name: Run the billed Dart probe
        run: dart test test/live_test.dart -r expanded

  java-live:
    name: Java live core routes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
      NROUTER_LIVE_CHAT_MODEL: gpt-3.5-turbo
      NROUTER_LIVE_RESPONSES_MODEL: gpt-3.5-turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Require the dedicated health-check key
        run: test -n "$NROUTER_API_KEY"

      - name: Run low-cost Java probes
        run: >-
          mvn -B
          -Dtest=LiveTest#liveClaudeRequestReturnsBillingMetadata+liveOpenAiChatCompletionsWireAnswers+liveResponsesWireAnswers
          test

  kotlin-live:
    name: Kotlin live core routes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_LIVE: '1'
      NROUTER_LIVE_CHAT_MODEL: gpt-3.5-turbo
      NROUTER_LIVE_RESPONSES_MODEL: gpt-3.5-turbo
      NROUTER_LIVE_EMBEDDINGS_MODEL: text-embedding-3-small
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Require the dedicated health-check key
        run: test -n "$NROUTER_API_KEY"

      - name: Run low-cost Kotlin probes
        run: >-
          ./gradlew test --no-daemon
          --tests '*LiveTest.live Claude stream reaches the configured gateway'
          --tests '*LiveTest.live OpenAI chat completions wire answers'
          --tests '*LiveTest.live Responses wire answers'

  rust-live:
    name: Rust live core routes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
      NROUTER_LIVE_CHAT_MODEL: ${{ vars.NROUTER_LIVE_CHAT_MODEL }}
      NROUTER_LIVE_RESPONSES_MODEL: ${{ vars.NROUTER_LIVE_RESPONSES_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify live-test configuration
        run: |
          test -n "$NROUTER_API_KEY"
          test -n "$NROUTER_LIVE_CHAT_MODEL"
          test -n "$NROUTER_LIVE_RESPONSES_MODEL"
      - name: Run low-cost Rust probes
        run: |
          cargo test --locked --test live live_claude_stream_reaches_the_configured_gateway -- --ignored
          cargo test --locked --test live live_openai_chat_completions_wire_answers -- --ignored
          cargo test --locked --test live live_responses_wire_answers -- --ignored

  go-live:
    name: Go live Messages stream
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - name: Require the dedicated health-check key
        run: test -n "$NROUTER_API_KEY"
      - name: Run the billed Go probe
        run: go test -run '^TestLiveClaude$' ./...

  android-live:
    name: Android live Messages stream
    runs-on: ubuntu-latest
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3
      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
      - name: Publish shared Kotlin core locally
        working-directory: sdks/kotlin
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Run the billed Android probe
        working-directory: sdks/android
        run: ./gradlew testDebugUnitTest --no-daemon --tests 'ai.nrouter.sdk.android.LiveTest'

  swift-live:
    name: Swift live Messages stream
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sdks/swift
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the dedicated health-check key
        run: test -n "$NROUTER_API_KEY"
      - name: Run the billed Swift probe
        run: swift test --filter LiveTests.testLiveClaudeStream

  r-live:
    name: R live Messages routes
    runs-on: ubuntu-latest
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_HEALTH_API_KEY }}
      NROUTER_BASE_URL: https://api.nrouter.ai/v1
      NROUTER_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdks/r
          needs: test
      - name: Require the dedicated health-check key
        run: test -n "$NROUTER_API_KEY"
      - name: Run low-cost R probes
        working-directory: sdks/r
        run: Rscript -e "testthat::test_local(filter = 'live')"

# Image, text-to-speech, and video calls are intentionally manual-only:
# they cost more than these text/embedding health probes.
